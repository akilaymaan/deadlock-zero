name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke-test the production server
        run: |
          PORT=3100 LOG_LEVEL=warn node dist/server/index.js &
          SERVER_PID=$!
          for attempt in $(seq 1 20); do curl -fsS http://127.0.0.1:3100/api/health && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:3100/api/ready
          curl -fsS http://127.0.0.1:3100/ | grep -q '<div id="root">'
          kill -TERM "$SERVER_PID"
          wait "$SERVER_PID"
      - run: npm run audit

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t deadlock-zero:ci .
      - name: Container passes its health check endpoint
        run: |
          docker run -d --name dz -p 3000:3000 deadlock-zero:ci
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/health && break; sleep 1; done
          docker exec dz id -un | grep -qx node
          docker rm -f dz
